# This file is named for SonarCloud AUTOMATIC ANALYSIS, which is what this
# project runs — there is no scanner step in CI. Automatic analysis reads
# `.sonarcloud.properties`; a `sonar-project.properties` is the CLI scanner's
# filename and is silently ignored, which cost one red gate to find out.
#
# Duplication exclusions — ONLY for files this repo duplicates on purpose.
#
# The quality gate allows 3% duplication in new code, and adding a solver page
# blows through it by construction: each solver keeps its own copy of the
# infrastructure below. On the logic-grid PR that was 3.7%, of which 245 lines
# were these three files alone.
#
# They are here because the architecture REQUIRES the copies, not because
# de-duplicating them would be tedious:
#
#   MemoryProbe.h, Budget.h  — CLAUDE.md keeps every src/pages/*/a-star
#     independently configurable, because CLion's build profiles point straight
#     at those directories. On top of that, buildWasm.ts hashes every *.h in the
#     a-star ROOT to decide whether the wasm is stale, so a header moved out of
#     it would stop invalidating the binary when it changed — a silently stale
#     .wasm, which is worse than any amount of duplication.
#
#   astar.worker.js — reached page-relative from its own generated *-wasm/
#     directory (`../lg-wasm/astar.worker.js`), which is what makes the same URL
#     resolve under the dev server and under GitHub Pages. One shared copy would
#     have to be published into each of those directories anyway.
#
# Deliberately NOT excluded, because they COULD be extracted into src/util/ the
# way editorShell.ts and configValidation.ts already were, and should stay
# visible until they are: wasmBridge.ts's worker race, buildWasm.ts's per-solver
# variant block, and fixtures_test.cpp's corpus sweep. See the gate section in
# CLION-INSPECTIONS.md.
sonar.cpd.exclusions=src/pages/*/a-star/MemoryProbe.h,src/pages/*/a-star/Budget.h,src/pages/*/wasm/astar.worker.js
