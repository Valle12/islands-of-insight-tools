name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs on the same PR — a push-heavy branch otherwise keeps
# several full graphs alive at once. Never on main: those runs are what
# deploy.yml looks up when it reuses a dist artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # PINNED, not `latest`. The wasm cache key below claims that identical C++
  # plus identical flags means identical wasm; that is only true if the compiler
  # is pinned too. Bumping this invalidates every wasm cache entry, which is the
  # intended behavior.
  EMSDK_VERSION: "6.0.4"

jobs:
  # The one expensive artifact everything else needs. Built once, cached on its
  # inputs, and handed to the other jobs as an artifact.
  wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    # Sixteen LTO variants on a cold cache now, not twelve.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # EXACT key, deliberately no restore-keys: a prefix match would restore
      # wasm built from different C++, and every suite downstream would test the
      # stale binary — green, and meaningless.
      #
      # GitHub's `*` does not cross directory boundaries, so a-star/test/** and
      # a-star/bench/** correctly do NOT invalidate this.
      - name: Restore wasm cache
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: |
            src/pages/rolling-blocks-solver/wasm/astar*.mjs
            src/pages/rolling-blocks-solver/wasm/astar*.wasm
            src/pages/rolling-blocks-solver/wasm/astar*.stamp
            src/pages/shifting-mosaic-solver/wasm/astar*.mjs
            src/pages/shifting-mosaic-solver/wasm/astar*.wasm
            src/pages/shifting-mosaic-solver/wasm/astar*.stamp
            src/pages/match-three-solver/wasm/astar*.mjs
            src/pages/match-three-solver/wasm/astar*.wasm
            src/pages/match-three-solver/wasm/astar*.stamp
            src/pages/logic-grid-solver/wasm/astar*.mjs
            src/pages/logic-grid-solver/wasm/astar*.wasm
            src/pages/logic-grid-solver/wasm/astar*.stamp
          key: wasm-${{ runner.os }}-emsdk${{ env.EMSDK_VERSION }}-${{ hashFiles('src/pages/*/a-star/*.cpp', 'src/pages/*/a-star/*.h', 'src/util/buildWasm.ts') }}

      - name: Setup bun
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup wasm toolchain
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-wasm
        with:
          emsdk-version: ${{ env.EMSDK_VERSION }}

      # Replaces ~90 lines of inline em++ shell that duplicated the source lists
      # and the flag set. buildWasm.ts needs no `bun ci` — it imports only
      # node:crypto/node:fs/node:path and Bun.which — and it builds the four
      # variants of a solver concurrently, where the old shell loop was serial.
      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: bun run build:wasm

      # The stamps travel with the binaries: without them the `dist` job would
      # see no up-to-date markers and try to compile, which it has no toolchain
      # for.
      - name: Upload wasm
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: |
            src/pages/*/wasm/astar*.mjs
            src/pages/*/wasm/astar*.wasm
            src/pages/*/wasm/astar*.stamp
          retention-days: 7
          if-no-files-found: error

  # Independent of wasm: the native gtest suites compile the same TUs with the
  # host compiler.
  cpp:
    name: C++ tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Plain apt, deliberately not cached. It measures 19s, and this job's wall
      # clock is dominated by shiftingMosaicTest37 (~112s of the ~130s ctest),
      # so a package cache would buy ~10s for a third-party dependency.
      #
      # ccache is absent for the same reason: the OBJECT libraries plus -j
      # already took the build from 162s serial to ~50s, and caching objects
      # cannot touch the test time that actually sets this job's length.
      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y libboost-dev nlohmann-json3-dev libgtest-dev cmake

      # ONE configure over both solvers, via the repo-root aggregate. Developers
      # still configure src/pages/*/a-star directly; see CLAUDE.md.
      - name: Configure
        run: >
          cmake -B build-ci -S .
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      # -j matters: the old two builds ran single-threaded on a 4-vCPU runner.
      - name: Build
        run: cmake --build build-ci -j "$(nproc)"

      # -j is safe because the shifting-mosaic fixtures carry PROCESSORS 8 (they
      # each run the production six-arm std::thread cascade and want the whole
      # machine), so ctest schedules them alone while the cheap rolling-blocks
      # tests fill the remaining slots.
      - name: Test
        run: ctest --test-dir build-ci -j "$(nproc)" --output-on-failure

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun ci
      # CLAUDE.md makes this mandatory before calling work done, and CI never
      # ran it. `bun run`, not `bunx`: the script resolves the typescript
      # pinned in bun.lock instead of letting bunx fetch a version nothing
      # pinned (Sonar githubactions:S8543).
      - name: tsc --noEmit
        run: bun run typecheck

  # Between them these six shards run EVERY test under test/ — there is no env
  # gate that can leave a suite silently unregistered.
  bun-test:
    name: bun test (${{ matrix.name }})
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # One shard per slow suite, sized by measured wall clock
          # (~244s / ~60s / ~75s / ~22s / ~90s), and a sixth for everything
          # else. Logic-grid's corpus sweep lived in the fast shard while it
          # measured 617 ms for 36 boards; at 436 captured boards it passed
          # 90 s and became `wasm.slow.test.ts` with a shard of its own.
          - name: sm-wasm
            filter: test/shifting-mosaic-solver/wasm.slow.test.ts
          - name: rb-astar
            filter: test/rolling-blocks-solver/aStar.slow.test.ts
          - name: mt-wasm
            filter: test/match-three-solver/wasm.slow.test.ts
          - name: match-three-solve
            filter: test/match-three-solver/engine.solve.slow.test.ts
          - name: lg-wasm
            filter: test/logic-grid-solver/wasm.slow.test.ts
          - name: fast
            filter: ""
            skip-slow: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun ci
      - name: Download wasm
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: src/pages
      - name: Run tests
        run: bun test ${{ matrix.filter }}
        env:
          IOI_SKIP_SLOW: ${{ matrix.skip-slow }}

  e2e:
    name: e2e (shard ${{ matrix.shard }}/2)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun ci
      - name: Download wasm
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: src/pages

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Naming chromium matters: a bare `install --with-deps` pulls firefox and
      # webkit too, and playwright.config.ts declares a single chromium
      # project. The browser download is a no-op once the cache above restored
      # it, so this needs no cache-hit condition — only the apt half re-runs.
      #
      # `bun run`, not `bunx`, so the playwright pinned in bun.lock is used
      # rather than one bunx resolves at run time (Sonar githubactions:S8543).
      - name: Install Playwright chromium
        run: bun run e2e:install

      # Sharded across runners rather than raising `workers` above 1: each spec
      # drives a multi-arm wasm portfolio inside the browser, so two runners at
      # one worker each is strictly safer than one runner at two workers.
      - name: Run e2e tests
        run: bun run e2e -- --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  mem64:
    name: MEMORY64 (node)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Download wasm
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: src/pages

      # bun cannot instantiate a Memory64 module, so the mem64 builds are tested
      # under node instead of in `bun test`.
      #
      # The node version is PINNED rather than taken from the runner image: the
      # ubuntu-24.04 default validates a 64-bit MEMORY but rejects the 64-bit
      # TABLE that emscripten 6.x emits for every wasm64 build, so the module
      # fails to compile with "invalid table elements limits flags". The test's
      # own probe now covers tables too, so an under-capable runtime SKIPS —
      # which means without this pin the gate would quietly stop testing
      # anything at all.
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # EVERY file. This step used to name only the shifting-mosaic one, so the
      # rolling-blocks MEMORY64 build was never loaded in CI; a solver whose
      # test is missing here is a build nothing ever instantiates.
      - name: Run MEMORY64 wasm tests
        run: node --test test/shifting-mosaic-solver/mem64.node.test.mjs test/rolling-blocks-solver/mem64.node.test.mjs test/match-three-solver/mem64.node.test.mjs test/logic-grid-solver/mem64.node.test.mjs

  # Proves the production bundle still builds on every PR — nothing checked that
  # before — and publishes the artifact deploy.yml reuses.
  dist:
    name: Build dist
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun ci
      - name: Download wasm
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: src/pages

      # build.ts imports ./buildWasm for its side effect. With the wasm and its
      # stamps already on disk all eight variants skip, so this needs no
      # emscripten and is just the Bun.build passes.
      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
